# ─────────────────────────────────────────────────────────────────────────────
# Domino-Job: PH-Scoring — Job-Datei (pro Use-Case-Job eine Kopie).
#
# Flache KEY="wert"-Syntax; wird von run_scoring.sh geladen (kein YAML nötig).
# In der Domino-Job-Definition als Kommando eintragen:
#   bash production/run_scoring.sh production/jobs/job_ph.conf
#
# Neuer Use-Case: Datei kopieren (job_<uc>.conf), Werte anpassen, committen.
# Erlaubte Schlüssel: siehe unten bzw. bash production/run_scoring.sh --help
# ─────────────────────────────────────────────────────────────────────────────

# Welche Scoring-Configs dieser Job fährt (Leerzeichen-Liste möglich):
SCORING_CONFIGS="production/scoring_ph.yml"

# Code-Stand — für Prod auf annotiertes Tag oder Commit-SHA pinnen:
GIT_REF="main"

# Für Prod-Jobs empfohlen: 1 = Abbruch, wenn GIT_REF ein Branch ist:
REQUIRE_PINNED_REF=0

# Fehlerpolitik bei mehreren Configs: 1 = alle versuchen, Exit 1 bei Teilfehlern:
CONTINUE_ON_ERROR=0

# Optional — Git-Identity nach dem TFS-Umgebungs-Muster (fürs Klonen nicht nötig):
# GIT_USER_EMAIL="svc-user@lan.huk-coburg.de"
# GIT_USER_NAME="SVC rubin"
